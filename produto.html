<!doctype html>
<html lang="pt-BR">

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --base:#3B4730; --base-escuro:#36402C; --base-claro:#4F5A45; --tinta:#1B1F17; --apoio:#79909B; --neutro:#F6F6F5; --borda:rgba(59,71,48,.14); --serif:"Instrument Serif",Georgia,serif; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:#fff; color:var(--tinta); font:15px/1.55 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font-family:inherit; }
  .pagina { max-width:1320px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .palco { position:relative; background:var(--neutro); border-radius:28px; overflow:hidden; }
  model-viewer { display:block; width:100%; height:56vh; min-height:340px; background:transparent; --poster-color:transparent; --progress-bar-color:var(--base); }
  .status { position:absolute; inset:0; display:grid; place-items:center; color:var(--apoio); font-size:11px; letter-spacing:.14em; text-transform:uppercase; pointer-events:none; }
  .ra { position:absolute; right:14px; top:14px; border:0; border-radius:999px; background:var(--base); color:#fff; padding:11px 18px; font:500 14px Roboto, sans-serif; cursor:pointer; }
  .ra:hover { background:var(--base-escuro); }
  .vistas { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:4px; padding:4px; border-radius:999px; background:rgba(255,255,255,.86); border:1px solid var(--borda); backdrop-filter:blur(8px); max-width:calc(100% - 24px); }
  .vistas button { border:0; background:transparent; border-radius:999px; padding:7px 13px; font-size:12px; font-weight:500; color:var(--base-claro); cursor:pointer; white-space:nowrap; }
  .vistas button[aria-pressed="true"] { background:var(--base); color:#fff; }
  .painel { padding:4px 4px 24px; min-width:0; }
  .sobre { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--base); font-weight:700; margin:0; }
  h1 { font-family:var(--serif); font-weight:400; font-size:clamp(34px,5vw,50px); line-height:.98; letter-spacing:-.02em; margin:10px 0 12px; text-wrap:balance; }
  h1 em { font-style:italic; color:var(--base); }
  .texto { color:var(--base-claro); max-width:50ch; margin:0 0 20px; }
  .grupo { background:#fff; border:1px solid var(--borda); border-radius:20px; padding:14px 16px 16px; margin:0 0 12px; }
  .grupo h2 { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:0 0 12px; font:700 11px Roboto, sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--base); }
  .grupo h2 b { font-family:var(--serif); font-weight:400; font-size:20px; letter-spacing:0; text-transform:none; color:var(--tinta); }
  .linha { font-size:12px; color:var(--apoio); margin:12px 0 8px; }
  .amostras { display:flex; flex-wrap:wrap; gap:8px; }
  .sw { width:40px; height:40px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--borda); background-color:var(--neutro); background-size:cover; background-position:center; cursor:pointer; padding:0; transition:transform .15s; }
  .sw:hover { transform:scale(1.08); }
  .sw[aria-pressed="true"] { box-shadow:0 0 0 2px var(--tinta); }
  .sw:focus-visible, .pilula:focus-visible, .vistas button:focus-visible, .acao:focus-visible { outline:2px solid var(--base); outline-offset:3px; }
  .pilulas { display:flex; flex-wrap:wrap; gap:8px; }
  .pilula { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--borda); background:#fff; border-radius:999px; padding:6px 14px 6px 6px; font-size:13px; color:var(--tinta); cursor:pointer; }
  .pilula i { width:28px; height:28px; border-radius:50%; background-size:cover; background-position:center; background-color:var(--neutro); box-shadow:inset 0 0 0 1px var(--borda); }
  .pilula[aria-pressed="true"] { border-color:var(--tinta); box-shadow:0 0 0 1px var(--tinta); }
  .escolhido { display:flex; align-items:center; gap:12px; margin:0 0 4px; padding:0; border:0; background:none; cursor:zoom-in; text-align:left; color:inherit; }
  .escolhido i { width:64px; height:64px; border-radius:14px; background-size:220%; background-position:center; box-shadow:inset 0 0 0 1px var(--borda); flex:none; }
  .escolhido span { font-size:12px; color:var(--apoio); }
  .acoes { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:16px; }
  .acao { border:1px solid var(--base); background:#fff; color:var(--base); border-radius:999px; padding:10px 18px; font-size:14px; font-weight:500; cursor:pointer; }
  .acao:hover { background:var(--base); color:#fff; }
  .aviso { font-size:12px; color:var(--apoio); }
  .barra { position:sticky; bottom:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:12px; margin:16px -4px 0; padding:12px 16px; background:rgba(255,255,255,.96); border:1px solid var(--borda); border-radius:20px; backdrop-filter:blur(8px); }
  .barra small { display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--base); font-weight:700; }
  .barra strong { font-family:var(--serif); font-weight:400; font-size:26px; line-height:1.1; }
  .usar { border:0; border-radius:999px; background:var(--base); color:#fff; padding:13px 22px; font-size:15px; font-weight:500; cursor:pointer; white-space:nowrap; }
  .usar:hover { background:var(--base-escuro); }

  body.embed .pagina { padding:12px; }
  body.embed #compartilhar { display:none; }
  body.embed h1 { font-size:clamp(28px,4vw,40px); }
  .lupa { position:fixed; inset:0; z-index:20; background:rgba(27,31,23,.72); display:grid; place-items:center; padding:16px; }
  .lupa[hidden] { display:none; }
  .lupa figure { margin:0; background:#fff; border-radius:24px; overflow:hidden; width:min(92vw,560px); }
  .lupa img { display:block; width:100%; aspect-ratio:1; object-fit:cover; }
  .lupa figcaption { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 16px; font-family:var(--serif); font-size:20px; }
  .lupa button { border:0; background:var(--neutro); border-radius:999px; padding:8px 14px; font-size:13px; cursor:pointer; color:var(--tinta); }
  @media (max-width:899px) {
    /* celular: ao rolar para as opções, o 3D vira uma janelinha flutuante (arrastável; um toque volta ao topo) */
    body.mini .palco { position:fixed; z-index:30; width:136px; height:136px; right:12px; bottom:96px; border-radius:18px; box-shadow:0 8px 28px rgba(27,31,23,.28); border:1px solid var(--borda); touch-action:none; }
    body.mini .palco model-viewer { height:100%; min-height:0; pointer-events:none; }
    body.mini .palco .vistas, body.mini .palco .ra, body.mini .palco .status { display:none; }
    .mini-toque { display:none; position:absolute; inset:0; z-index:2; cursor:grab; touch-action:none; }
    body.mini .mini-toque { display:block; }
  }
  @media (min-width:900px) {
    .pagina { grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:28px; padding:28px; align-items:start; }
    .palco { position:sticky; top:28px; border-radius:36px; }
    model-viewer { height:calc(100vh - 56px); min-height:520px; }
    .painel { padding-top:12px; }
  }
</style>
</head>
<body>
<main class="pagina">
  <div class="palco">
    <model-viewer id="mv"
      alt="Produto em 3D"
      camera-controls touch-action="pan-y" shadow-intensity="1.25" shadow-softness="0.85" exposure="1.3"
      tone-mapping="commerce" interpolation-decay="110"
      camera-orbit="30deg 72deg auto"
      ar ar-modes="webxr quick-look" ar-scale="fixed" ar-placement="floor">
      <button slot="ar-button" class="ra">Ver no meu ambiente</button>
    </model-viewer>
    <div class="status" id="status">Preparando o modelo</div>
    <div class="vistas" id="vistas" hidden role="group" aria-label="Vistas">
      <button type="button" data-o="30deg 72deg auto" aria-pressed="true">Geral</button>
      <button type="button" data-o="0deg 82deg auto">Frente</button>
      <button type="button" data-o="90deg 82deg auto">Lado</button>
      <button type="button" data-o="180deg 80deg auto">Costas</button>
      <button type="button" id="v-detalhe" data-o="28deg 66deg auto" data-fov="22deg">Detalhe</button>
    </div>
  </div>

  <div class="painel">
    <p class="sobre" id="sobre">Alma Mobília</p>
    <h1 id="titulo">Peça, <em>do seu jeito</em></h1>
    <p class="texto"></p>
    <div id="debug" hidden style="font:12px/1.6 monospace;margin:0 0 12px"></div>

    <section class="grupo">
      <h2>Madeira <b id="nm-madeira"></b></h2>
      <div class="amostras" id="madeiras"></div>
    </section>
    <section class="grupo">
      <h2>Palha <b id="nm-encosto"></b></h2>
      <div class="pilulas" id="encostos"></div>
    </section>
    <section class="grupo">
      <h2>Acabamento <b id="nm-tecido"></b></h2>
      <button class="escolhido" id="escolhido" type="button" aria-label="Ampliar a amostra do acabamento"><i></i><span>Toque para ver a amostra de perto</span></button>
      <div id="tecidos"></div>
    </section>
    <section class="grupo" id="g-metal" hidden>
      <h2>Metal <b id="nm-metal"></b></h2>
      <div class="pilulas" id="metais"></div>
    </section>
    <section class="grupo" id="g-tamanho" hidden>
      <h2>Tamanho <b id="nm-tamanho"></b></h2>
      <div class="pilulas" id="tamanhos"></div>
    </section>
    <div class="acoes">
      <button class="acao" id="compartilhar" type="button">Compartilhar esta configuração</button>
      <span class="aviso" id="aviso" role="status"></span>
    </div>
    <div class="barra" id="barra" hidden>
      <div><small id="b-linha"></small><strong id="b-preco"></strong></div>
      <button class="usar" id="usar" type="button">Usar esta configuração</button>
    </div>
  </div>
</main>

<div class="lupa" id="lupa" hidden>
  <figure>
    <img id="lupa-img" alt="">
    <figcaption><span id="lupa-nome"></span><button type="button" id="lupa-fechar">Fechar</button></figcaption>
  </figure>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { PRODUTOS } from './alma/produtos.js';
import { KF } from './kf/catalogo.js';

const CDN = 'https://cdn.jsdelivr.net/gh/sanfranciscocenter/sfc-3d@main/pivot/';
const LOJA = 'https://sanfranciscocenter.cdn.magazord.com.br/img/';

// Tamanho real que cada textura cobre (em metros)
const TECIDO_TILE = 0.18;
const MADEIRA_U = 0.045, MADEIRA_V = 0.16;
const PALHA_TILE = 0.054;

// madeira mais fosca e com o veio mais marcado (pedido de Matheus, 12/11/2026): rugosidade maior e relevo 1,7
const MADEIRAS = [
  ['Avelã M01','m01-avela.jpg',0.74],
  ['Castanho M02','m02-castanho.jpg',0.74],
  ['Mocca M03','m03-mocca.jpg',0.74],
  ['Nero Fosco M04','m04-nero-b.jpg',0.92],
  ['Nero Fosco Semibrilho M05','m05-nero-semibrilho-b.jpg',0.52]
];
const PALHAS = [
  ['Natural PN01', 'pn01-natural.png', '2025/05/produto/25389/natural-pn-01.jpg', '#D6C296', '#D8C08E'],
  ['Bronze PN02', 'pn02-bronze.png', '2025/05/produto/25388/bronze-pn02.jpg', '#A87A42', '#B27C3E'],
  ['Preta PN03', 'pn03-preta.png', '2025/05/produto/25390/preta-pn03.jpg', '#262321', '#2B2826']
];
const GRUPOS = [
  ['Tecido Essencial', [501,514,517,523,524,525,530,539,542,543,545,546,547,548,549,550]],
  ['Tecido Premium',   [502,503,504,505,507,538,540,541,544]],
  ['Couro',            [534,535,537,551,552,553,554,555,556]]
];
const TIPO = { grosso: [3.4, 1.0], medio: [2.7, 1.0], fino: [1.9, 1.0], liso: [0.8, 0.95], couro: [0.8, 0.88],   // opacos em todo o plugin (pedido de Matheus, 12/11/2026)
  // KF: couro e camurça opacos e suaves (Matheus achou o produto espelhado demais em 12/11/2026)
  camurca: [0.7, 1.0], couroFosco: [0.75, 0.88],
  // bouclé KF: terceiro valor = relevo de volume [raio px, força] para as bolinhas aparecerem em 3D
  boucle: [2.2, 1.0, [5, 26]], linhoKF: [2.4, 1.0, [3, 9]] };
const TIPO_DE = {};
[502,503,504,505,507,530,538,540,541].forEach(c => TIPO_DE[c] = 'grosso');
[501,539,542,543].forEach(c => TIPO_DE[c] = 'medio');
[514,517,523,524,525].forEach(c => TIPO_DE[c] = 'fino');
[544,545,546,547,548,549,550].forEach(c => TIPO_DE[c] = 'liso');
[534,535,537,551,552,553,554,555,556].forEach(c => TIPO_DE[c] = 'couro');
const MIDIA = {501:30360,502:30361,503:30362,504:30363,505:30364,507:30365,514:30366,517:30367,523:30368,524:30369,525:30370,530:30371,538:30372,539:30373,540:30374,541:30375,542:30376,543:30377,544:30378,545:30379,546:30380,547:30381,548:30382,549:30383,550:30384,534:30351,535:30352,537:30353,551:30354,552:30355,553:30356,554:30357,555:30358,556:30359};

const $ = id => document.getElementById(id);
const mv = $('mv'), statusEl = $('status');
const par = new URLSearchParams(location.search);
const CHAVE = par.get('p') || '', P = PRODUTOS[CHAVE];
const DEBUG = par.get('debug') === '1';

/* ---------- 1. Modelo ---------- */
function analisa(geo) {
  const pos = geo.attributes.position, n = pos.count;
  const idx = geo.index ? geo.index.array : Uint32Array.from({ length: n }, (_, i) => i);
  const mapa = new Map(), w = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    const k = Math.round(pos.getX(i) * 1e4) + ',' + Math.round(pos.getY(i) * 1e4) + ',' + Math.round(pos.getZ(i) * 1e4);
    let id = mapa.get(k); if (id === undefined) { id = mapa.size; mapa.set(k, id); } w[i] = id;
  }
  const pai = Int32Array.from({ length: mapa.size }, (_, i) => i);
  const acha = a => { while (pai[a] !== a) { pai[a] = pai[pai[a]]; a = pai[a]; } return a; };
  for (let t = 0; t < idx.length; t += 3) {
    const a = acha(w[idx[t]]), b = acha(w[idx[t + 1]]), c = acha(w[idx[t + 2]]);
    if (b !== a) pai[b] = a; const c2 = acha(c); if (c2 !== a) pai[c2] = a;
  }
  const nt = idx.length / 3, raiz = t => acha(w[idx[t * 3]]), caixas = new Map();
  for (let t = 0; t < nt; t++) {
    const r = raiz(t); let b = caixas.get(r);
    if (!b) { b = { min: [1e9, 1e9, 1e9], max: [-1e9, -1e9, -1e9], tris: 0 }; caixas.set(r, b); } b.tris++;
    for (let k = 0; k < 3; k++) { const i = idx[t * 3 + k], p = [pos.getX(i), pos.getY(i), pos.getZ(i)];
      for (let a = 0; a < 3; a++) { if (p[a] < b.min[a]) b.min[a] = p[a]; if (p[a] > b.max[a]) b.max[a] = p[a]; } }
  }
  for (const b of caixas.values()) { const d = [0, 1, 2].map(a => b.max[a] - b.min[a]); b.tam = d; b.longo = d.indexOf(Math.max(...d)); b.centro = [0, 1, 2].map(a => (b.max[a] + b.min[a]) / 2); }
  return { idx, nt, raiz, caixas };
}

// Geometria com mapeamento de textura (UV) em caixa, na escala real do material.
function monta(geo, an, modo) {
  const pos = geo.attributes.position, nor = geo.attributes.normal, { idx, nt, raiz, caixas } = an;
  const P3 = [], N = [], UV = [];
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), fn = new THREE.Vector3();
  const lado = modo === 'palha' ? (P.palhaTile || PALHA_TILE) : CAT.tile;
  // Correção de bloco: peça fechada com as faces viradas para dentro (aparece "furada", dá para ver através dela).
  // O volume assinado de cada peça solta diz se está do avesso; nesse caso a ordem dos vértices é invertida.
  const vol = new Map();
  if (modo !== 'palha') for (let t = 0; t < nt; t++) {
    A.fromBufferAttribute(pos, idx[t * 3]); B.fromBufferAttribute(pos, idx[t * 3 + 1]); C.fromBufferAttribute(pos, idx[t * 3 + 2]);
    const r = raiz(t), c = caixas.get(r).centro; A.x -= c[0]; A.y -= c[1]; A.z -= c[2]; B.x -= c[0]; B.y -= c[1]; B.z -= c[2]; C.x -= c[0]; C.y -= c[1]; C.z -= c[2];
    vol.set(r, (vol.get(r) || 0) + A.dot(B.clone().cross(C)) / 6);
  }
  const avesso = r => { const v = vol.get(r), d = caixas.get(r).tam; return v !== undefined && v < -0.02 * d[0] * d[1] * d[2]; };
  for (let t = 0; t < nt; t++) {
    const r = raiz(t), inv = avesso(r);
    const i0 = idx[t * 3], i1 = idx[t * 3 + (inv ? 2 : 1)], i2 = idx[t * 3 + (inv ? 1 : 2)];
    A.fromBufferAttribute(pos, i0); B.fromBufferAttribute(pos, i1); C.fromBufferAttribute(pos, i2);
    fn.subVectors(B, A).cross(C.clone().sub(A));
    const an3 = [Math.abs(fn.x), Math.abs(fn.y), Math.abs(fn.z)], nAxis = an3.indexOf(Math.max(...an3));
    let uA, vA, su, sv;
    if (modo === 'madeira') {
      const L = caixas.get(r).longo;   // o veio acompanha o comprimento de cada peça
      if (L !== nAxis) { vA = L; uA = 3 - L - nAxis; } else { [uA, vA] = [0, 1, 2].filter(a => a !== nAxis); }
      su = MADEIRA_U; sv = MADEIRA_V;
    } else {
      [uA, vA] = nAxis === 0 ? [2, 1] : nAxis === 1 ? [0, 2] : [0, 1];
      su = sv = lado;
    }
    for (const i of [i0, i1, i2]) {
      const p = [pos.getX(i), pos.getY(i), pos.getZ(i)];
      P3.push(...p);
      if (nor) { const nx = nor.getX(i), ny = nor.getY(i), nz = nor.getZ(i), s = nx * fn.x + ny * fn.y + nz * fn.z < 0 ? -1 : 1; N.push(nx * s, ny * s, nz * s); }   // normal sempre para fora
      UV.push(p[uA] / su, p[vA] / sv);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P3, 3));
  if (nor) g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3)); else g.computeVertexNormals();
  g.setAttribute('uv', new THREE.Float32BufferAttribute(UV, 2));
  return g;
}
function junta(geos) {
  const g = new THREE.BufferGeometry();
  for (const nome of ['position', 'normal', 'uv']) {
    const tam = nome === 'uv' ? 2 : 3, arr = new Float32Array(geos.reduce((s, x) => s + x.attributes[nome].array.length, 0)); let o = 0;
    for (const x of geos) { arr.set(x.attributes[nome].array, o); o += x.attributes[nome].array.length; }
    g.setAttribute(nome, new THREE.BufferAttribute(arr, tam));
  }
  return g;
}

// A palha vem modelada como uma placa com espessura. Fica só a face da frente (ou de cima),
// senão as duas camadas vazadas aparecem uma atrás da outra.
function umaFace(geo) {
  const g = geo.index ? geo.toNonIndexed() : geo, pos = g.attributes.position, nor = g.attributes.normal;
  g.computeBoundingBox(); const t = g.boundingBox.getSize(new THREE.Vector3()).toArray(), eixo = t.indexOf(Math.min(...t));
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), n = new THREE.Vector3(), lado = [], area = [0, 0];
  for (let i = 0; i < pos.count; i += 3) {
    A.fromBufferAttribute(pos, i); B.fromBufferAttribute(pos, i + 1); C.fromBufferAttribute(pos, i + 2);
    n.subVectors(B, A).cross(C.sub(A)); const a = n.length() || 1e-12, c = n.getComponent(eixo) / a;
    const s = c > 0.08 ? 1 : c < -0.08 ? 0 : -1; lado.push(s); if (s >= 0) area[s] += a;
  }

const carregaImg = url => new Promise((ok, erro) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = erro; i.src = url; });

        for (let py = 0; py < H; py++) { g[py * W + px] = s / n; s += tmp[((py + R + 1) % H) * W + px] - tmp[((py - R + H) % H) * W + px]; } }
    }

  const nada = Promise.resolve(null), comTextura = tem('tecido') && urlT;
  const [mc, mn, tc, tn, pc] = await Promise.all([
    tem('madeira') ? textura('mc:' + arqM, urlM, 'image/jpeg') : nada, tem('madeira') ? textura('mn:' + arqM, relevoDe(urlM, 1.7, 512, 1024), 'image/jpeg') : nada,
    comTextura ? textura('tc:' + estado.t, urlT, 'image/jpeg', CAT.escala(estado.t)) : nada, comTextura ? textura('tn:' + estado.t, relevoDe(urlT, forca, 1024, 1024, volume), 'image/jpeg', CAT.escala(estado.t)) : nada,
    tem('palha') ? textura('p:' + arqE, palhaLimpa(CDN + 'palhas-v2/' + arqE), 'image/png') : nada
  ]);
  if (minha !== vez) return;
  const m = mat('madeira'), t = mat('tecido'), p = mat('palha');
  if (m && mc) { m.pbrMetallicRoughness.setBaseColorFactor('#ffffff'); m.pbrMetallicRoughness.baseColorTexture.setTexture(mc); m.normalTexture.setTexture(mn); m.pbrMetallicRoughness.setRoughnessFactor(roughM); }
  if (t && tc) { t.pbrMetallicRoughness.setBaseColorFactor('#ffffff'); t.pbrMetallicRoughness.baseColorTexture.setTexture(tc); t.normalTexture.setTexture(tn); t.pbrMetallicRoughness.setRoughnessFactor(rough); }
  // escala própria do couro: tem de ser aplicada DEPOIS de pôr a textura no material (antes disso o visualizador descarta)
  if (t && tc) { const e = CAT.escala(estado.t); for (const info of [t.pbrMetallicRoughness.baseColorTexture, t.normalTexture]) { const s = info && info.texture && info.texture.sampler; if (s && s.setScale) s.setScale({ u: e, v: e }); } }
  if (t && corT) { t.pbrMetallicRoughness.baseColorTexture.setTexture(null); t.normalTexture.setTexture(null); t.pbrMetallicRoughness.setBaseColorFactor(corT); t.pbrMetallicRoughness.setRoughnessFactor(rough); }
  const mt = mat('metal'); if (mt && METAIS.length) { mt.pbrMetallicRoughness.setBaseColorFactor(METAIS[estado.x][1]); mt.pbrMetallicRoughness.setMetallicFactor(0.55); mt.pbrMetallicRoughness.setRoughnessFactor(0.45); }
  if (p && pc) { p.pbrMetallicRoughness.baseColorTexture.setTexture(pc); p.setAlphaMode('MASK'); p.setAlphaCutoff(0.5); p.setDoubleSided(true); }
  const f = mat('forro'); if (f) f.pbrMetallicRoughness.setBaseColorFactor(PALHAS[estado.e][3]);
  const v = mat('vivo'); if (v) v.pbrMetallicRoughness.setBaseColorFactor(PALHAS[estado.e][4]);
}

/* ---------- 4. Interface ---------- */
function marca(caixa, botao) { caixa.querySelectorAll('[aria-pressed]').forEach(s => s.setAttribute('aria-pressed', 'false')); botao.setAttribute('aria-pressed', 'true'); }
function amostra(rotulo, img, ativo, aoEscolher, caixa, chave) {
  const b = document.createElement('button'); b.dataset.k = chave;
  b.className = 'sw'; b.type = 'button'; b.title = rotulo; b.setAttribute('aria-label', rotulo); b.setAttribute('aria-pressed', ativo ? 'true' : 'false');
  if (img && img.folha) { b.style.backgroundImage = `url("${img.folha}")`; b.style.backgroundSize = `${img.cols * 100}% ${img.lins * 100}%`; b.style.backgroundPosition = `${img.col / (img.cols - 1) * 100}% ${img.lin / Math.max(1, img.lins - 1) * 100}%`; }
  else if (img && img[0] === '#') b.style.backgroundColor = img; else if (img) b.style.backgroundImage = `url("${img}")`;
  b.addEventListener('click', () => { marca(caixa, b); aoEscolher(); aplica(); });
  return b;
}
function pilula(caixa, rotulo, cor, ativo, aoEscolher, chave) {
  const b = document.createElement('button'); b.className = 'pilula'; b.type = 'button'; b.dataset.k = chave; b.setAttribute('aria-pressed', ativo ? 'true' : 'false');
  if (cor) { const bola = document.createElement('i'); bola.style.backgroundColor = cor; b.append(bola); } else b.style.paddingLeft = '14px';
  b.append(rotulo);
  b.addEventListener('click', () => { marca(caixa, b); aoEscolher(); });
  caixa.appendChild(b);
}
// troca de tamanho: o modelo é refeito na nova largura (o evento "load" reaplica os materiais)
const modelos = new Map();
async function trocaModelo() {
  const L = larguraAtual(), k = String(L);
  if (!modelos.has(k)) modelos.set(k, prepararModelo(L));
  const url = await modelos.get(k); if (k !== String(larguraAtual())) return;
  if (mv.src !== url) { pronto = false; mv.src = url; } else aplica();
}
const boxM = $('madeiras'), boxE = $('encostos'), boxT = $('tecidos'), boxV = $('vistas'), boxX = $('metais'), boxZ = $('tamanhos');
function montaInterface() {
  MADEIRAS.forEach(([nome, arq], i) => boxM.appendChild(amostra(nome, CDN + 'madeiras-v2/' + arq, i === estado.m, () => estado.m = i, boxM, i)));
  PALHAS.forEach(([nome, arq, mini], i) => {
    const b = document.createElement('button'); b.className = 'pilula'; b.type = 'button'; b.dataset.k = i; b.setAttribute('aria-pressed', i === estado.e ? 'true' : 'false');
    const bola = document.createElement('i'); bola.style.backgroundImage = `url("${LOJA}${mini}?ims=fit-in/96x96")`;
    b.append(bola, nome.replace(/ PN\d+$/, ''));
    b.addEventListener('click', () => { marca(boxE, b); estado.e = i; aplica(); });
    boxE.appendChild(b);
  });
  CAT.grupos.forEach(([titulo, codigos]) => {
    const g = document.createElement('div'); g.className = 'linha'; g.textContent = titulo; boxT.appendChild(g);
    const linha = document.createElement('div'); linha.className = 'amostras'; boxT.appendChild(linha);
    codigos.forEach(c => linha.appendChild(amostra(CAT.nome(c), CAT.mini(c) || CAT.cor(c), c === estado.t, () => estado.t = c, boxT, c)));
  });
  METAIS.forEach(([nome, cor], i) => pilula(boxX, nome, cor, i === estado.x, () => { estado.x = i; aplica(); }, i));
  TAMANHOS.forEach((cm, i) => pilula(boxZ, cm + ' cm', null, i === estado.z, () => { estado.z = i; aplica(); trocaModelo(); }, i));
}
function ajustaGrupos() {   // só aparecem os grupos de opção que este produto tem
  boxM.closest('.grupo').hidden = !tem('madeira'); boxE.closest('.grupo').hidden = !tem('palha'); boxT.closest('.grupo').hidden = !tem('tecido');
  $('g-metal').hidden = !(METAIS.length && tem('metal')); $('g-tamanho').hidden = !TAMANHOS.length;
  if (EH_KF) boxT.closest('.grupo').querySelector('h2').firstChild.textContent = 'Tecido ';
  const itens = [TAMANHOS.length && 'o tamanho', tem('madeira') && 'a madeira', tem('palha') && 'a palha', tem('tecido') && (EH_KF ? 'o tecido' : 'o acabamento'), METAIS.length && tem('metal') && 'o metal'].filter(Boolean);
  const lista = itens.length > 1 ? itens.slice(0, -1).join(', ') + ' e ' + itens.at(-1) : itens[0] || 'as opções';
  const peca = /^banqueta/i.test(P.nome) ? 'a banqueta' : /^poltrona/i.test(P.nome) ? 'a poltrona' : /^sof/i.test(P.nome) ? 'o sofá' : 'a cadeira';
  document.querySelector('.texto').textContent = `Escolha ${lista} e veja a peça mudar na hora. No celular, toque em “Ver no meu ambiente” para colocar ${peca} na sua sala.`;
}

if (EMBED) {
  document.body.classList.add('embed'); $('barra').hidden = false;
  const SITES = ['https://www.sanfranciscocenter.com.br', 'https://sanfranciscocenter.com.br'];
  const marcaTudo = () => {
    for (const [caixa, k] of [[boxM, estado.m], [boxE, estado.e], [boxT, estado.t], [boxX, estado.x], [boxZ, estado.z]])
      caixa.querySelectorAll('[data-k]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === String(k) ? 'true' : 'false'));
  };
  window.addEventListener('message', ev => {
    if (!SITES.includes(ev.origin) || !ev.data || ev.data.sfc3d !== 'estado') return;
    const d = ev.data;
    if (d.precos && typeof d.precos === 'object') precos = d.precos;
    const m = MADEIRAS.findIndex(x => x[0] === d.madeira); if (m >= 0) estado.m = m;
    const e = PALHAS.findIndex(x => x[0] === d.tela); if (e >= 0) estado.e = e;
    const c = CAT.deSite(d.acabamento); if (CAT.valido(c)) estado.t = c;
    const x = METAIS.findIndex(q => q[0] === d.metal); if (x >= 0) estado.x = x;
    const z = TAMANHOS.indexOf(parseInt(d.tamanho, 10)); if (z >= 0 && z !== estado.z) { estado.z = z; trocaModelo(); }
    marcaTudo(); aplica();
  });
  $('usar').addEventListener('click', () => parent.postMessage({
    sfc3d: 'usar', madeira: MADEIRAS[estado.m][0], tela: tem('palha') ? PALHAS[estado.e][0] : '',
    acabamento: tem('tecido') ? CAT.valorSite(estado.t) : '', linha: tem('tecido') ? CAT.linha(estado.t) : '',
    metal: METAIS.length ? METAIS[estado.x][0] : '', tamanho: TAMANHOS.length ? TAMANHOS[estado.z] : ''
  }, '*'));
}

boxV.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  marca(boxV, b); mv.cameraTarget = b.dataset.alvo || 'auto auto auto'; mv.fieldOfView = b.dataset.fov || 'auto'; mv.cameraOrbit = b.dataset.o;
}));

const lupa = $('lupa');
$('escolhido').addEventListener('click', () => { if (!CAT.url(estado.t)) return; $('lupa-img').src = CAT.url(estado.t); $('lupa-img').alt = CAT.nome(estado.t); $('lupa-nome').textContent = CAT.nome(estado.t); lupa.hidden = false; $('lupa-fechar').focus(); });
const fechaLupa = () => { lupa.hidden = true; $('escolhido').focus(); };
$('lupa-fechar').addEventListener('click', fechaLupa);
lupa.addEventListener('click', e => { if (e.target === lupa) fechaLupa(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lupa.hidden) fechaLupa(); });

$('compartilhar').addEventListener('click', async () => {
  const url = `${location.origin}${location.pathname}?p=${encodeURIComponent(CHAVE)}&m=${estado.m}&e=${estado.e}&t=${encodeURIComponent(estado.t)}&x=${estado.x}&z=${estado.z}`;
  const texto = [P.nome + ': ' + MADEIRAS[estado.m][0], tem('palha') && 'palha ' + PALHAS[estado.e][0], tem('tecido') && CAT.nome(estado.t), METAIS.length && 'metal ' + METAIS[estado.x][0], TAMANHOS.length && TAMANHOS[estado.z] + ' cm'].filter(Boolean).join(', ');
  try {
    if (navigator.share) await navigator.share({ title: P.nome, text: texto, url });
    else { await navigator.clipboard.writeText(url); $('aviso').textContent = 'Link copiado'; setTimeout(() => $('aviso').textContent = '', 2500); }
  } catch (e) { if (e.name !== 'AbortError') $('aviso').textContent = 'Não foi possível compartilhar'; }
});

// Celular: quando o 3D sai da tela ao rolar, ele vira uma janelinha flutuante no canto (como o vídeo minimizado
// do YouTube): dá para arrastar, e um toque volta ao topo. Um espaço reserva guarda a altura original, então a
// página não pula (a versão anterior mudava a altura durante a rolagem e travava tudo).
(() => {
  const palco = document.querySelector('.palco'), tela = matchMedia('(max-width:899px)');
  const lugar = document.createElement('div'); lugar.hidden = true; palco.parentNode.insertBefore(lugar, palco);
  const toque = document.createElement('div'); toque.className = 'mini-toque'; toque.setAttribute('role', 'button'); toque.setAttribute('aria-label', 'Voltar ao produto em 3D'); palco.appendChild(toque);
  let mini = false, ini = null;
  function liga(v) {
    if (v === mini) return; mini = v;
    if (v) { lugar.style.height = palco.offsetHeight + 'px'; lugar.hidden = false; }
    else { lugar.hidden = true; palco.style.left = palco.style.top = palco.style.right = palco.style.bottom = ''; }
    document.body.classList.toggle('mini', v);
  }
  function confere() {
    if (!tela.matches) return liga(false);
    const r = (mini ? lugar : palco).getBoundingClientRect();
    liga(r.bottom < Math.min(140, r.height * 0.35));
  }
  addEventListener('scroll', confere, { passive: true }); addEventListener('resize', confere);
  toque.addEventListener('pointerdown', e => { const r = palco.getBoundingClientRect(); ini = { x: e.clientX, y: e.clientY, l: r.left, t: r.top, andou: false }; try { toque.setPointerCapture(e.pointerId); } catch (err) {} });
  toque.addEventListener('pointermove', e => {
    if (!ini) return; const dx = e.clientX - ini.x, dy = e.clientY - ini.y; if (Math.hypot(dx, dy) > 6) ini.andou = true; if (!ini.andou) return;
    const w = palco.offsetWidth, h = palco.offsetHeight; palco.style.right = palco.style.bottom = 'auto';
    palco.style.left = Math.max(6, Math.min(innerWidth - w - 6, ini.l + dx)) + 'px'; palco.style.top = Math.max(6, Math.min(innerHeight - h - 6, ini.t + dy)) + 'px';
  });
  toque.addEventListener('pointerup', () => {
    if (!ini) return; const foi = ini.andou; ini = null;
    if (!foi) return scrollTo({ top: 0, behavior: 'smooth' });
    const r = palco.getBoundingClientRect(); palco.style.left = (r.left + r.width / 2 < innerWidth / 2 ? 8 : innerWidth - r.width - 8) + 'px';   // encosta na lateral mais próxima
  });
  toque.addEventListener('pointercancel', () => { ini = null; });
})();
// Dentro de aplicativos (janela embutida) o componente esconde o botão de realidade aumentada.
// Nesse caso entra um botão próprio: no iPhone tenta abrir o visualizador da Apple; se não abrir (ou no Android),
// leva o cliente ao navegador do aparelho com a mesma configuração.
function arAlternativo() {
  if (mv.canActivateAR || $('ra-alt')) return;
  const ua = navigator.userAgent, ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1), android = /Android/.test(ua);
  if (!ios && !android) return;
  const fora = () => {
    const q = new URLSearchParams(location.search); q.delete('embed'); q.set('m', estado.m); q.set('e', estado.e); q.set('t', estado.t); q.set('x', estado.x); q.set('z', estado.z);
    const resto = location.host + location.pathname + '?' + q;
    const a = document.createElement('a'); a.target = '_top';
    a.href = ios ? 'x-safari-https://' + resto : 'intent://' + resto + '#Intent;scheme=https;action=android.intent.action.VIEW;end';
    document.body.appendChild(a); a.click(); a.remove();
  };
  const b = document.createElement('button'); b.id = 'ra-alt'; b.className = 'ra'; b.type = 'button'; b.textContent = 'Ver no meu ambiente';
  let tentou = false;
  b.addEventListener('click', async () => {
    if (!ios || tentou || typeof mv.prepareUSDZ !== 'function') return fora();
    tentou = true; b.textContent = 'Preparando…';
    try {
      const url = await mv.prepareUSDZ(), a = document.createElement('a'); a.rel = 'ar'; a.href = url; a.appendChild(document.createElement('img'));
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { console.error(e); }
    // se o visualizador não abriu, o botão passa a levar ao Safari
    setTimeout(() => { b.textContent = document.hidden ? 'Ver no meu ambiente' : 'Abrir no Safari para ver no ambiente'; if (document.hidden) tentou = false; }, 2500);
  });
  mv.parentElement.appendChild(b);
}
// Vista "Detalhe": aproxima do encontro de assento e encosto, calculada pelo tamanho de cada produto
function ajustaDetalhe() {
  const d = mv.getDimensions(), b = $('v-detalhe'); if (!b || !d) return;
  const maior = Math.max(d.x, d.y, d.z);
  b.dataset.alvo = `${(d.x * 0.12).toFixed(2)}m ${(d.y * 0.66).toFixed(2)}m 0m`;
  b.dataset.o = `28deg 66deg ${(maior * 1.45).toFixed(2)}m`;
}
mv.addEventListener('load', () => { statusEl.hidden = true; boxV.hidden = false; pronto = true; ajustaDetalhe(); aplica(); setTimeout(arAlternativo, 800); });
try {
  if (!P) throw new Error('Produto não cadastrado: ' + CHAVE);
  document.title = P.nome + ' · Personalize em 3D'; mv.alt = P.nome + ' em 3D';
  $('sobre').textContent = P.sobre || 'Alma Mobília'; $('titulo').firstChild.textContent = P.nome + ', ';
  await customElements.whenDefined('model-viewer');
  mv.environmentImage = CDN + 'luz/estudio.hdr';
  const k0 = String(larguraAtual()); modelos.set(k0, prepararModelo(larguraAtual()));
  const url = await modelos.get(k0);
  montaInterface(); ajustaGrupos();
  if (EMBED) parent.postMessage({ sfc3d: 'pronto' }, '*');
  if (String(larguraAtual()) === k0) mv.src = url; else trocaModelo();
} catch (e) { statusEl.textContent = 'Não foi possível carregar o modelo'; console.error(e); }
</script>
