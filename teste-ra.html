<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cadeira Pivot · Personalize em 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --base:#3B4730; --base-escuro:#36402C; --base-claro:#4F5A45; --tinta:#1B1F17; --apoio:#79909B; --neutro:#F6F6F5; --borda:rgba(59,71,48,.14); --serif:"Instrument Serif",Georgia,serif; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:#fff; color:var(--tinta); font:15px/1.55 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .pagina { max-width:1320px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .palco { position:relative; background:var(--neutro); border-radius:28px; overflow:hidden; }
  model-viewer { display:block; width:100%; height:56vh; min-height:340px; background:transparent; --poster-color:transparent; --progress-bar-color:var(--base); }
  .status { position:absolute; inset:0; display:grid; place-items:center; color:var(--apoio); font-size:11px; letter-spacing:.14em; text-transform:uppercase; pointer-events:none; }
  .dica { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--apoio); white-space:nowrap; pointer-events:none; }
  .ra { position:absolute; right:14px; top:14px; border:0; border-radius:999px; background:var(--base); color:#fff; padding:11px 18px; font:500 14px Roboto, sans-serif; cursor:pointer; }
  .ra:hover { background:var(--base-escuro); }
  .painel { padding:4px 4px 24px; min-width:0; }
  .sobre { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--base); font-weight:700; margin:0; }
  h1 { font-family:var(--serif); font-weight:400; font-size:clamp(34px,5vw,50px); line-height:.98; letter-spacing:-.02em; margin:10px 0 12px; text-wrap:balance; }
  h1 em { font-style:italic; color:var(--base); }
  .texto { color:var(--base-claro); max-width:50ch; margin:0 0 20px; }
  .grupo { background:#fff; border:1px solid var(--borda); border-radius:20px; padding:14px 16px 16px; margin:0 0 12px; }
  .grupo h2 { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:0 0 12px; font:700 11px Roboto, sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--base); }
  .grupo h2 b { font-family:var(--serif); font-weight:400; font-size:20px; letter-spacing:0; text-transform:none; color:var(--tinta); }
  .linha { font-size:12px; color:var(--apoio); margin:12px 0 8px; }
  .linha:first-of-type { margin-top:0; }
  .amostras { display:flex; flex-wrap:wrap; gap:8px; }
  .sw { width:40px; height:40px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--borda); background-color:var(--neutro); background-size:cover; background-position:center; cursor:pointer; padding:0; transition:transform .15s; }
  .sw:hover { transform:scale(1.08); }
  .sw[aria-pressed="true"] { box-shadow:0 0 0 2px var(--tinta); }
  .sw:focus-visible { outline:2px solid var(--base); outline-offset:3px; }
  @media (min-width:900px) {
    .pagina { grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:28px; padding:28px; align-items:start; }
    .palco { position:sticky; top:28px; border-radius:36px; }
    model-viewer { height:calc(100vh - 56px); min-height:520px; }
    .painel { padding-top:12px; }
  }
</style>
</head>
<body>
<main class="pagina">
  <div class="palco">
    <model-viewer id="mv"
      alt="Cadeira Pivot em 3D"
      camera-controls touch-action="pan-y" shadow-intensity="1.1" shadow-softness="0.9" exposure="1.05"
      environment-image="neutral" tone-mapping="commerce" interpolation-decay="120"
      camera-orbit="30deg 72deg auto"
      ar ar-modes="webxr quick-look" ar-scale="fixed" ar-placement="floor">
      <button slot="ar-button" class="ra">Ver no meu ambiente</button>
    </model-viewer>
    <div class="status" id="status">Preparando o modelo</div>
    <div class="dica" id="dica" hidden>Arraste para girar</div>
  </div>

  <div class="painel">
    <p class="sobre">Alma Mobília · Design Felipe Madeira</p>
    <h1>Cadeira Pivot, <em>do seu jeito</em></h1>
    <p class="texto">Escolha a madeira e o acabamento e veja a peça mudar na hora. No celular, toque em “Ver no meu ambiente” para colocar a cadeira na sua sala.</p>

    <section class="grupo">
      <h2>Madeira <b id="nm-madeira"></b></h2>
      <div class="amostras" id="madeiras"></div>
    </section>
    <section class="grupo">
      <h2>Acabamento <b id="nm-tecido"></b></h2>
      <div id="tecidos"></div>
    </section>
  </div>
</main>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const CDN = 'https://cdn.jsdelivr.net/gh/matheussanfrancisco/sfc-3d@main/pivot/';
const LOJA = 'https://sanfranciscocenter.cdn.magazord.com.br/img/2026/09/produto/';
const GLB = CDN + 'modelo/pivot-estofada-draco.glb';

// Tamanho real que cada textura cobre (em metros)
const TECIDO_TILE = 0.13;                    // lado da foto do tecido
const MADEIRA_U = 0.045, MADEIRA_V = 0.20;   // largura x comprimento do veio

const MADEIRAS = [
  ['Avelã M01','m01-avela.png',0.50],
  ['Castanho M02','m02-castanho.png',0.50],
  ['Mocca M03','m03-mocca.png',0.50],
  ['Nero Fosco M04','m04-nero.png',0.85],
  ['Nero Fosco Semibrilho M05','m05-nero-semibrilho.png',0.32]
];
// [linha, códigos, rugosidade, força do relevo]
const GRUPOS = [
  ['Tecido Essencial', [501,514,517,523,524,525,530,539,542,543,545,546,547,548,549,550], 1.0, 2.4],
  ['Tecido Premium',   [502,503,504,505,507,538,540,541,544], 1.0, 2.4],
  ['Couro',            [534,535,537,551,552,553,554,555,556], 0.55, 1.2]
];
// acabamentos das linhas de tecido que são lisos (sintéticos e camurças): menos relevo, mais brilho
const LISOS = new Set([544, 545, 546, 547, 548, 549]);
// miniaturas das amostras (as mesmas do site)
const MIDIA = {501:30360,502:30361,503:30362,504:30363,505:30364,507:30365,514:30366,517:30367,523:30368,524:30369,525:30370,530:30371,538:30372,539:30373,540:30374,541:30375,542:30376,543:30377,544:30378,545:30379,546:30380,547:30381,548:30382,549:30383,550:30384,534:30351,535:30352,537:30353,551:30354,552:30355,553:30356,554:30357,555:30358,556:30359};

const mv = document.getElementById('mv');
const statusEl = document.getElementById('status');

/* ---------- 1. Modelo: gera o mapeamento de textura (UV) em caixa ---------- */
function componentes(geo) {
  const pos = geo.attributes.position, n = pos.count;
  const idx = geo.index ? geo.index.array : Uint32Array.from({ length: n }, (_, i) => i);
  const mapa = new Map(), w = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    const k = Math.round(pos.getX(i) * 1e4) + ',' + Math.round(pos.getY(i) * 1e4) + ',' + Math.round(pos.getZ(i) * 1e4);
    let id = mapa.get(k); if (id === undefined) { id = mapa.size; mapa.set(k, id); } w[i] = id;
  }
  const pai = Int32Array.from({ length: mapa.size }, (_, i) => i);
  const acha = a => { while (pai[a] !== a) { pai[a] = pai[pai[a]]; a = pai[a]; } return a; };
  for (let t = 0; t < idx.length; t += 3) {
    const a = acha(w[idx[t]]), b = acha(w[idx[t + 1]]), c = acha(w[idx[t + 2]]);
    if (b !== a) pai[b] = a; const c2 = acha(c); if (c2 !== a) pai[c2] = a;
  }
  return { idx, raizDoTri: t => acha(w[idx[t * 3]]) };
}

function comUV(geo, modo) {
  const pos = geo.attributes.position, nor = geo.attributes.normal;
  const { idx, raizDoTri } = componentes(geo);
  const nt = idx.length / 3;
  // caixa de cada peça solta -> eixo mais comprido (direção do veio)
  const caixas = new Map();
  for (let t = 0; t < nt; t++) {
    const r = raizDoTri(t); let b = caixas.get(r);
    if (!b) { b = { min: [1e9, 1e9, 1e9], max: [-1e9, -1e9, -1e9] }; caixas.set(r, b); }
    for (let k = 0; k < 3; k++) { const i = idx[t * 3 + k]; const p = [pos.getX(i), pos.getY(i), pos.getZ(i)];
      for (let a = 0; a < 3; a++) { if (p[a] < b.min[a]) b.min[a] = p[a]; if (p[a] > b.max[a]) b.max[a] = p[a]; } }
  }
  for (const b of caixas.values()) { const d = [0, 1, 2].map(a => b.max[a] - b.min[a]); b.longo = d.indexOf(Math.max(...d)); }

  const P = new Float32Array(nt * 9), N = new Float32Array(nt * 9), UV = new Float32Array(nt * 6);
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), fn = new THREE.Vector3();
  for (let t = 0; t < nt; t++) {
    const i0 = idx[t * 3], i1 = idx[t * 3 + 1], i2 = idx[t * 3 + 2];
    A.fromBufferAttribute(pos, i0); B.fromBufferAttribute(pos, i1); C.fromBufferAttribute(pos, i2);
    fn.subVectors(B, A).cross(C.clone().sub(A));
    const an = [Math.abs(fn.x), Math.abs(fn.y), Math.abs(fn.z)]; const nAxis = an.indexOf(Math.max(...an));
    let uA, vA, su, sv;
    if (modo === 'madeira') {
      const L = caixas.get(raizDoTri(t)).longo;
      if (L !== nAxis) { vA = L; uA = 3 - L - nAxis; } else { [uA, vA] = [0, 1, 2].filter(a => a !== nAxis); }
      su = MADEIRA_U; sv = MADEIRA_V;
    } else {
      [uA, vA] = nAxis === 0 ? [2, 1] : nAxis === 1 ? [0, 2] : [0, 1];
      su = sv = TECIDO_TILE;
    }
    [i0, i1, i2].forEach((i, k) => {
      const p = [pos.getX(i), pos.getY(i), pos.getZ(i)];
      P.set(p, t * 9 + k * 3);
      if (nor) N.set([nor.getX(i), nor.getY(i), nor.getZ(i)], t * 9 + k * 3);
      UV.set([p[uA] / su, p[vA] / sv], t * 6 + k * 2);
    });
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(P, 3));
  if (nor) g.setAttribute('normal', new THREE.BufferAttribute(N, 3)); else g.computeVertexNormals();
  g.setAttribute('uv', new THREE.BufferAttribute(UV, 2));
  return g;
}

async function prepararModelo() {
  const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
  const gltf = await new GLTFLoader().setDRACOLoader(draco).loadAsync(GLB);
  gltf.scene.updateMatrixWorld(true);
  const cena = new THREE.Scene();
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    const nome = (o.material.name || o.name || '').toLowerCase();
    const geo = o.geometry.clone().applyMatrix4(o.matrixWorld);
    const modo = nome.includes('madeira') ? 'madeira' : nome.includes('tecido') ? 'tecido' : null;
    const g = modo ? comUV(geo, modo) : geo;
    // tecido ganha "sheen": o brilho aveludado suave que estofado tem nas bordas
    const m = modo === 'tecido'
      ? new THREE.MeshPhysicalMaterial({ name: nome, color: 0xffffff, roughness: 1, metalness: 0, sheen: 1, sheenRoughness: 0.55, sheenColor: new THREE.Color(0.16, 0.16, 0.16) })
      : new THREE.MeshStandardMaterial({ name: nome, color: 0xffffff, roughness: 0.6, metalness: 0 });
    if (nome.includes('latao')) { m.color.set(0xCFA65F); m.roughness = 0.3; m.metalness = 0.9; }
    const mesh = new THREE.Mesh(g, m); mesh.name = nome; cena.add(mesh);
  });
  const buf = await new GLTFExporter().parseAsync(cena, { binary: true });
  return URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' }));
}

/* ---------- 2. Texturas ---------- */
const carregaImg = url => new Promise((ok, erro) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = erro; i.src = url; });

// As fotos em tecidos-v2 vêm do original da fábrica, já com luz nivelada e emenda nas bordas (repetem sem costura).
// Aqui só se calcula o mapa de relevo a partir da própria foto.
async function relevoDe(url, forca) {
  const img = await carregaImg(url), S = 1024;
  const c = document.createElement('canvas'); c.width = c.height = S; const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, S, S);
  const d = x.getImageData(0, 0, S, S).data, h = new Float32Array(S * S);
  for (let p = 0; p < S * S; p++) h[p] = (d[p * 4] * 0.299 + d[p * 4 + 1] * 0.587 + d[p * 4 + 2] * 0.114) / 255;
  const out = x.createImageData(S, S), M = S - 1;
  for (let py = 0; py < S; py++) { const ya = ((py - 1) & M) * S, yb = ((py + 1) & M) * S, y0 = py * S;
    for (let px = 0; px < S; px++) {
      const dx = (h[y0 + ((px + 1) & M)] - h[y0 + ((px - 1) & M)]) * forca, dy = (h[yb + px] - h[ya + px]) * forca;
      const inv = 1 / Math.hypot(dx, dy, 1), o = (y0 + px) * 4;
      out.data[o] = (-dx * inv * 0.5 + 0.5) * 255; out.data[o + 1] = (dy * inv * 0.5 + 0.5) * 255; out.data[o + 2] = (inv * 0.5 + 0.5) * 255; out.data[o + 3] = 255;
    } }
  x.putImageData(out, 0, 0);
  return new Promise(ok => c.toBlob(b => ok(URL.createObjectURL(b)), 'image/jpeg', 0.92));
}

const cache = new Map();
function textura(chave, uri, tipo) {
  if (!cache.has(chave)) cache.set(chave, (async () => {
    const t = await mv.createTexture(await uri, tipo);
    t.sampler.setWrapS(10497); t.sampler.setWrapT(10497);
    return t;
  })());
  return cache.get(chave);
}
const mat = nome => mv.model?.materials.find(m => m.name === nome);
let vezM = 0, vezT = 0;

async function aplicaMadeira(nome, arq, rough) {
  const vez = ++vezM; document.getElementById('nm-madeira').textContent = nome;
  const t = await textura('m:' + arq, CDN + 'madeiras/' + arq, 'image/png'); if (vez !== vezM) return;
  const m = mat('madeira'); if (!m) return;
  m.pbrMetallicRoughness.setBaseColorFactor('#ffffff');
  m.pbrMetallicRoughness.baseColorTexture.setTexture(t);
  m.pbrMetallicRoughness.setRoughnessFactor(rough);
}
async function aplicaTecido(nome, cod, rough, forca) {
  const vez = ++vezT; document.getElementById('nm-tecido').textContent = nome;
  if (LISOS.has(cod)) { rough = 0.6; forca = 1.0; }
  const url = CDN + `tecidos-v2/tc${cod}.jpg`;
  const [tc, tn] = await Promise.all([textura('c:' + cod, url, 'image/jpeg'), textura('n:' + cod, relevoDe(url, forca), 'image/jpeg')]);
  if (vez !== vezT) return;
  const m = mat('tecido'); if (!m) return;
  m.pbrMetallicRoughness.setBaseColorFactor('#ffffff');
  m.pbrMetallicRoughness.baseColorTexture.setTexture(tc);
  m.normalTexture.setTexture(tn);
  m.pbrMetallicRoughness.setRoughnessFactor(rough);
}

/* ---------- 3. Interface ---------- */
function amostra(rotulo, img, aoEscolher, grupo) {
  const b = document.createElement('button');
  b.className = 'sw'; b.type = 'button'; b.title = rotulo; b.setAttribute('aria-label', rotulo); b.setAttribute('aria-pressed', 'false');
  b.style.backgroundImage = `url("${img}")`;
  b.addEventListener('click', () => {
    grupo.querySelectorAll('.sw').forEach(s => s.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true'); aoEscolher();
  });
  return b;
}
const boxM = document.getElementById('madeiras');
MADEIRAS.forEach(([nome, arq, rough]) => boxM.appendChild(amostra(nome, CDN + 'madeiras/' + arq, () => aplicaMadeira(nome, arq, rough), boxM)));
const boxT = document.getElementById('tecidos');
GRUPOS.forEach(([titulo, codigos, rough, forca]) => {
  const g = document.createElement('div'); g.className = 'linha'; g.textContent = titulo; boxT.appendChild(g);
  const linha = document.createElement('div'); linha.className = 'amostras'; boxT.appendChild(linha);
  codigos.forEach(c => { const nome = `${titulo} · TC ${c}`;
    linha.appendChild(amostra(nome, `${LOJA}${MIDIA[c]}/crn-tc${c}.jpg?ims=fit-in/96x96`, () => aplicaTecido(nome, c, rough, forca), boxT)); });
});

mv.addEventListener('load', () => {
  statusEl.hidden = true; document.getElementById('dica').hidden = false;
  boxM.querySelector('.sw').click(); boxT.querySelector('.sw').click();
});
mv.addEventListener('camera-change', e => { if (e.detail.source === 'user-interaction') document.getElementById('dica').hidden = true; });
try {
  await customElements.whenDefined('model-viewer');
  mv.src = await prepararModelo();
} catch (e) { statusEl.textContent = 'Não foi possível carregar o modelo'; console.error(e); }
</script>
</body>
</html>
